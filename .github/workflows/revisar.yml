name: Revisar HTML

on:
  pull_request:
  push:
    branches: [main]

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Revisar el HTML
        run: npx --yes html-validate "**/*.html"